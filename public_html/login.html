<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistema IF</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #064e3b, #10b981);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo img {
            width: 100px;
            margin-bottom: 10px;
        }

        .logo h4 {
            color: #065f46;
            font-weight: bold;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .btn-login {
            background: #047857;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #065f46;
            color: white;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            <img src="img/logo IF.png"
                 alt="Logo Instituto Federal"
                 onerror="this.style.display='none'">

            <h4>Sistema IF</h4>
            <p class="text-muted">Acesse sua conta</p>
        </div>

        <form action="login.php" method="POST">

            <div class="mb-3">
                <label class="form-label">Usuário</label>

                <input
                    type="text"
                    name="usuario"
                    class="form-control"
                    placeholder="Digite seu usuário"
                    required
                >
            </div>

            <div class="mb-4">
                <label class="form-label">Senha</label>

                <input
                    type="password"
                    name="senha"
                    class="form-control"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit" class="btn btn-login w-100">
                Entrar
            </button>

        </form>

        <div class="footer">
            © 2026 - Sistema IF
            <br>
            Instituto Federal
        </div>

    </div>

</body>
</html>
